<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7f2"><title>녹음 · TTS</title><link rel="stylesheet" href="./style.css?v=auto2"></head>
<body>
<main>
  <section class="recorder" aria-label="음성 녹음">
    <div class="record-actions"><button id="startRecord" class="primary"><span class="record-dot"></span>녹음 시작</button><button id="stopRecord" class="secondary" disabled><span class="stop-square"></span>종료</button></div>
    <div class="record-status" aria-live="polite"><span id="recordState">녹음 준비</span><strong id="timer">00:00:00</strong></div>
    <canvas id="liveWave" height="48" aria-label="마이크 음량"></canvas>
    <div class="connection" aria-live="polite"><i id="connectionDot"></i><span id="connectionText">맥북 연결 중</span></div>
    <p id="pendingCount" class="small" aria-live="polite"></p>
  </section>
  <section class="tts" aria-label="TTS 재생">
    <textarea id="ttsText" rows="5" maxlength="500" placeholder="읽을 텍스트를 입력하세요." aria-label="읽을 텍스트"></textarea>
    <button id="speak" class="primary play">▷ 재생</button>
    <p id="ttsStatus" class="small" aria-live="polite"></p>
    <audio id="ttsAudio" controls hidden></audio>
  </section>
</main>
<div id="notice" role="status" aria-live="polite" hidden></div>
<script src="./app.js?v=auto2" defer></script>
</body></html>
